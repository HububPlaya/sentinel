name: PR review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test-reviewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load skill
        id: skill
        run: |
          {
            echo "SKILL<<EOF"
            cat .claude/skills/pr-review-tests/SKILL.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        env:
          VERDICT_FILE: ${{ runner.temp }}/verdict.txt
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --allowedTools "Bash"
          prompt: |
            ${{ steps.skill.outputs.SKILL }}

      - name: Gate on verdict
        run: |
          verdict="$(cat "${{ runner.temp }}/verdict.txt" 2>/dev/null || echo MISSING)"
          echo "verdict: $verdict"
          [ "$verdict" = "PASS" ]

  requirements-reviewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load skill
        id: skill
        run: |
          {
            echo "SKILL<<EOF"
            cat .claude/skills/pr-review-requirements/SKILL.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        env:
          VERDICT_FILE: ${{ runner.temp }}/verdict.txt
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --allowedTools "Bash"
          prompt: |
            ${{ steps.skill.outputs.SKILL }}

      - name: Gate on verdict
        run: |
          verdict="$(cat "${{ runner.temp }}/verdict.txt" 2>/dev/null || echo MISSING)"
          echo "verdict: $verdict"
          [ "$verdict" = "PASS" ]

  code-reviewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load skill
        id: skill
        run: |
          {
            echo "SKILL<<EOF"
            cat .claude/skills/pr-review-code/SKILL.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        env:
          VERDICT_FILE: ${{ runner.temp }}/verdict.txt
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --allowedTools "Bash"
          prompt: |
            ${{ steps.skill.outputs.SKILL }}

      - name: Gate on verdict
        run: |
          verdict="$(cat "${{ runner.temp }}/verdict.txt" 2>/dev/null || echo MISSING)"
          echo "verdict: $verdict"
          [ "$verdict" = "PASS" ]

  notify-ready-to-merge:
    runs-on: ubuntu-latest
    needs: [test-reviewer, requirements-reviewer, code-reviewer]
    # needs: defaults to requiring all three to succeed -- this job is
    # skipped entirely if any one of them failed, so no extra `if:` needed.
    steps:
      - name: Email that the PR is ready to merge
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: sentinel CI
          to: ${{ secrets.MAIL_USERNAME }}
          subject: "PR #${{ github.event.pull_request.number }} -- all reviews passed, ready to merge"
          body: |
            ${{ github.event.pull_request.title }}
            ${{ github.event.pull_request.html_url }}

            Test, requirements, and code reviewers all passed. Nothing has
            been merged -- this is a notification only.
