<svg width="900" height="640" viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Four-stack Elastic Beanstalk + RDS architecture, current state</title>
  <desc>Config feeds app.py, the composition root, which creates four stacks with different
  lifecycles: ApplicationStack (the EB Application, deployed once ever), NetworkStack (the EB
  security group, deployed once per environment and rarely touched again), DatabaseStack (the
  RDS instance, fully independent of EB), and EnvironmentStack (the EB Environment itself,
  which changes most often and references the other three's outputs). EnvironmentStack's EB
  environment now sets explicit VPC configuration -- VPCId, Subnets, ELBSubnets -- which was
  the actual root cause of a real, reproduced deploy failure; a security-group propagation-lag
  theory initially looked plausible but was disproven by direct testing. An external app
  pipeline updates the running code via the EB API directly, not through CloudFormation.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#185fa5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="450" y="26" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#2c2c2a">Elastic Beanstalk + RDS — four-stack architecture</text>
  <text x="450" y="44" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">Simplified view — see docs/elastic-beanstalk/deploy-flow.md for per-construct detail</text>

  <!-- config/ -->
  <rect x="300" y="58" width="300" height="48" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="450" y="78" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#2c2c2a">config/</text>
  <text x="450" y="96" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">Per-environment sizing, AZs, DB settings</text>

  <line x1="450" y1="106" x2="450" y2="122" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- app.py -->
  <rect x="300" y="122" width="300" height="48" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="450" y="142" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#2c2c2a">app.py</text>
  <text x="450" y="160" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">Composes all four stacks; grants access</text>

  <!-- fan-out arrows to each stack -->
  <line x1="420" y1="170" x2="120" y2="195" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="170" x2="340" y2="195" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="170" x2="560" y2="195" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="170" x2="780" y2="195" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stack row -->
  <rect x="20" y="195" width="200" height="65" rx="12" fill="#EEEDFE" stroke="#7f77dd" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="120" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#26215c">ApplicationStack</text>
  <text x="120" y="238" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3c3489">deployed once, ever</text>

  <rect x="240" y="195" width="200" height="65" rx="12" fill="#EEEDFE" stroke="#7f77dd" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="340" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#26215c">NetworkStack</text>
  <text x="340" y="238" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3c3489">rarely recreated</text>

  <rect x="460" y="195" width="200" height="65" rx="12" fill="#EEEDFE" stroke="#7f77dd" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="560" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#26215c">DatabaseStack</text>
  <text x="560" y="238" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3c3489">no dependency on EB</text>

  <rect x="680" y="195" width="200" height="65" rx="12" fill="#EEEDFE" stroke="#7f77dd" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="780" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#26215c">EnvironmentStack</text>
  <text x="780" y="238" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3c3489">changes most often</text>

  <!-- arrows down to AWS resources -->
  <line x1="120" y1="260" x2="120" y2="280" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="260" x2="340" y2="280" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="260" x2="560" y2="280" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="780" y1="260" x2="780" y2="280" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="450" y="278" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#5f5e5a">— real AWS resources —</text>

  <!-- Application resource -->
  <rect x="20" y="290" width="200" height="50" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="120" y="311" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#4A1B0C">EB application</text>
  <text x="120" y="329" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#993C1D">snack-recommender</text>

  <!-- Network resource -->
  <rect x="240" y="290" width="200" height="50" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="340" y="311" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#4A1B0C">EB security group</text>
  <text x="340" y="329" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#993C1D">per-environment</text>

  <!-- Database resource -->
  <rect x="460" y="290" width="200" height="65" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="560" y="311" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#4A1B0C">RDS instance</text>
  <text x="560" y="329" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#993C1D">KMS-encrypted,</text>
  <text x="560" y="345" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#993C1D">+ read replica, alarms</text>

  <!-- IAM role -->
  <rect x="680" y="290" width="200" height="40" rx="10" fill="#FAEEDA" stroke="#ba7517" stroke-width="1"/>
  <text x="780" y="308" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#412402">IAM role</text>
  <text x="780" y="324" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#854f0b">per-environment</text>

  <line x1="780" y1="330" x2="780" y2="345" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- EB Environment -->
  <rect x="680" y="345" width="200" height="75" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="780" y="365" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#4A1B0C">EB environment</text>
  <text x="780" y="382" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#993C1D">snack-recommender-&lt;env&gt;</text>
  <text x="780" y="399" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#993C1D">now VPC-configured</text>
  <text x="780" y="414" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#993C1D">(was the real bug)</text>

  <text x="780" y="437" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#5f5e5a">references NetworkStack's SG +</text>
  <text x="780" y="450" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#5f5e5a">DatabaseStack's host/secret</text>

  <!-- App pipeline (external) -->
  <line x1="780" y1="480" x2="780" y2="465" stroke="#185fa5" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-blue)"/>

  <rect x="680" y="480" width="200" height="65" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="780" y="502" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#2c2c2a">App pipeline (external)</text>
  <text x="780" y="519" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5f5e5a">Updates code via the EB API —</text>
  <text x="780" y="534" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5f5e5a">not through cdk deploy</text>

  <!-- Legend -->
  <rect x="20" y="580" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#888780"/>
  <text x="40" y="591" font-family="sans-serif" font-size="11" fill="#5f5e5a">CDK entry / external</text>
  <rect x="180" y="580" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#7f77dd"/>
  <text x="200" y="591" font-family="sans-serif" font-size="11" fill="#5f5e5a">Stack</text>
  <rect x="270" y="580" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#ba7517"/>
  <text x="290" y="591" font-family="sans-serif" font-size="11" fill="#5f5e5a">IAM</text>
  <rect x="350" y="580" width="14" height="14" rx="3" fill="#FAECE7" stroke="#D85A30"/>
  <text x="370" y="591" font-family="sans-serif" font-size="11" fill="#5f5e5a">Real AWS resource</text>

  <text x="450" y="615" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888780">Full story: docs/journal/2026-09-18/01-rds-and-eb-security-group-fix.md</text>
</svg>
