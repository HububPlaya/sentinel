[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-core"
version = "0.1.0"
description = "Shared platform capabilities (telemetry, and more as they land) for every app onboarded to the platform."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["platform_core*"]
